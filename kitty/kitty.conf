hide_window_decorations yes
disable_ligatures always
confirm_os_window_close 0

# Kitty + Neovim Navigation
allow_remote_control yes
include ${KITTY_OS}.conf

map ctrl+j kitten pass_keys.py neighboring_window bottom ctrl+j
map ctrl+k kitten pass_keys.py neighboring_window top    ctrl+k
map ctrl+h kitten pass_keys.py neighboring_window left   ctrl+h
map ctrl+l kitten pass_keys.py neighboring_window right  ctrl+l

# Layouts
enabled_layouts tall:bias=65

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9

map kitty_mod+l combine : launch --cwd=current --type tab : remote_control set-enabled-layouts tall:bias=65 : launch --cwd=current

# Fonts
font_size 18
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Visuals
cursor_trail 3

tab_bar_style separator
tab_separator ""
tab_title_template " {index}:{title} "
active_tab_font_style   bold-italic
inactive_tab_font_style normal

# Colours are generated by matugen (gitignored). Keep this include last so the
# generated palette wins over any defaults above.
include matugen.conf
