# matugen preset mode — renders a fixed palette (json import) through the
# *raw* templates (no lightness clamping). Used by `qsh theme <preset>`.
# Outputs go straight into the dotfiles repo; live configs are symlinked.

[config]
mode = "dark"

[templates.quickshell]
input_path = '~/.config/matugen/templates-raw/colors.qml'
output_path = '~/.dotfiles/quickshell/services/Colors.qml'
post_hook = '~/.dotfiles/bin/matugen-notify.sh'

[templates.hyprland]
input_path = '~/.config/matugen/templates-raw/hypr-colors.lua'
output_path = '~/.dotfiles/hypr/themes/matugen_colors.lua'
post_hook = 'hyprctl reload'

# [templates.waybar]
# input_path = '~/.config/matugen/templates-raw/waybar-colors.css'
# output_path = '~/.dotfiles/waybar/colors.css'
# post_hook = 'pkill -SIGUSR2 waybar || true'

[templates.obsidian-lore]
input_path = '~/.config/matugen/templates-raw/obsidian.css'
output_path = '~/Documents/LoreStore/.obsidian/snippets/matugen.css'

[templates.obsidian-backup]
input_path = '~/.config/matugen/templates-raw/obsidian.css'
output_path = '~/Documents/Lore Store Backup/.obsidian/snippets/matugen.css'

[templates.zen]
input_path = '~/.config/matugen/templates-raw/zen-userchrome.css'
output_path = '~/.zen/wenh0vy4.Default (release)/chrome/userChrome.css'

[templates.steam]
input_path = '~/.config/matugen/templates-raw/steam-custom.css'
output_path = '~/.steam/steam/steamui/libraryroot.custom.css'

[templates.prism]
input_path = '~/.config/matugen/templates-raw/prism-theme.json'
output_path = '~/.local/share/PrismLauncher/themes/matugen/theme.json'

[templates.prism-style]
input_path = '~/.config/matugen/templates-raw/prism-style.css'
output_path = '~/.local/share/PrismLauncher/themes/matugen/themeStyle.css'
