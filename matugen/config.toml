# matugen 4.2 — wallpaper-driven theme
# ------------------------------------
# Generates one palette and renders it into several targets. Repo-local
# outputs are gitignored; the live configs are symlinked, so matugen writes
# through the stow links:
#   quickshell/services/Colors.qml          → shell palette
#   hypr/themes/matugen_colors.lua          → Hyprland borders
#   chrome/matugen-chrome.css               → Librewolf browser chrome
#   chrome/matugen-content.css              → Librewolf about: pages
#   kitty/matugen.conf                      → Kitty palette
#   Obsidian snippet                        → Obsidian vault theme
#   Steam libraryroot.custom.css            → Steam library UI
#   Prism theme.json + themeStyle.css       → Prism Launcher theme
#
# Run it with:
#   matugen image <wallpaper>     or     qsh wallpaper <wallpaper>
# (qsh owns hyprpaper changes, so matugen's own wallpaper side-effects are
#  disabled below to avoid a broken / duplicate preload+set on the IPC.)

[config]
mode = "dark"
contrast = 0.0
# How the source colour is chosen from the image.
# source_color_index 0 = most dominant colour — keeps each wallpaper's own
# identity (a bright teal image stays teal, a deep purple one stays purple).
# Use `qsh colors <image>` to see the candidates and other options.
source_color_index = 0

[config.wallpaper]
# hyprpaper switching is handled by qsh (rewrites hypr/hyprpaper.conf and uses
# the IPC this build supports). matugen must not touch the wallpaper itself, so
# set=false disables it; the command field is still required by matugen but is
# never run because set=false.
set = false
pre_hook = ''
command = 'true'

[templates.quickshell]
input_path = '~/.config/matugen/templates/colors.qml'
output_path = '~/.dotfiles/quickshell/services/Colors.qml'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.dotfiles/hypr/themes/matugen_colors.lua'

[templates.librewolf-chrome]
input_path = '~/.config/matugen/templates/librewolf-chrome.css'
output_path = '~/.dotfiles/chrome/matugen-chrome.css'

[templates.librewolf-content]
input_path = '~/.config/matugen/templates/librewolf-content.css'
output_path = '~/.dotfiles/chrome/matugen-content.css'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.dotfiles/kitty/matugen.conf'

[templates.obsidian-lore]
input_path = '~/.config/matugen/templates/obsidian.css'
output_path = '~/Documents/LoreStore/.obsidian/snippets/matugen.css'

[templates.steam]
input_path = '~/.config/matugen/templates/steam-custom.css'
output_path = '~/.steam/steam/steamui/libraryroot.custom.css'

[templates.prism]
input_path = '~/.config/matugen/templates/prism-theme.json'
output_path = '~/.local/share/PrismLauncher/themes/matugen/theme.json'

[templates.prism-style]
input_path = '~/.config/matugen/templates/prism-style.css'
output_path = '~/.local/share/PrismLauncher/themes/matugen/themeStyle.css'
