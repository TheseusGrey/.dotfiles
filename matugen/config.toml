# matugen 4.2 — wallpaper-driven theme
# ------------------------------------
# Generates one palette and renders it into several targets (all inside the
# dotfiles repo; the live configs are symlinked, so this stays in sync):
#   outputs/quickshell/services/Colors.qml  → shell palette (Colors.qml)
#   hypr/themes/matugen_colors.lua          → hyprland borders
#   waybar/colors.css                       → waybar palette
#   obsidian css snippets                   → Obsidian vault theme
#   zen userChrome.css                      → Zen browser chrome
#   steam libraryroot.custom.css            → Steam library UI
#   prism theme.json + themeStyle.css       → Prism Launcher theme
#
# Run it with:
#   matugen image <wallpaper>     or     qsh wallpaper <wallpaper>
# (qsh owns hyprpaper changes, so matugen's own wallpaper side-effects are
#  disabled below to avoid a broken / duplicate preload+set on the IPC.)

[config]
mode = "dark"
contrast = 0.0
# How the source colour is chosen from the image.
# source_color_index 0 = most dominant colour — keeps each wallpaper's own
# identity (a bright teal image stays teal, a deep purple one stays purple).
# Use `qsh colors <image>` to see the candidates and other options.
# (Previously this used prefer = "closest-to-fallback" + fallback_color, which
#  dragged every image toward a near-white source and made unrelated images
#  produce near-identical schemes.)
source_color_index = 0

[config.wallpaper]
# hyprpaper switching is handled by qsh (rewrites hypr/hyprpaper.conf and uses
# the IPC this build supports). matugen must not touch the wallpaper itself, so
# set=false disables it; the command field is still required by matugen but is
# never run because set=false.
set = false
pre_hook = ''
command = 'true'

[templates.quickshell]
input_path = '~/.config/matugen/templates/colors.qml'
output_path = '/home/ashe/.dotfiles/quickshell/services/Colors.qml'
post_hook = '~/.dotfiles/bin/matugen-notify.sh'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '/home/ashe/.dotfiles/hypr/themes/matugen_colors.lua'
post_hook = 'hyprctl reload'

